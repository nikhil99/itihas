<!doctype html><meta charset="utf-8"><body style="margin:0">
<iframe id="f" src="index.html#/ZTL" style="width:1300px;height:900px;border:0"></iframe>
<script>
const q = new URLSearchParams(location.search), zin = +q.get('in') || 0, zout = +q.get('out') || 0, lanes = q.get('lanes');
const f = document.getElementById('f');
f.src = 'index.html#/' + (q.get('tl') || 'shivaji');
f.onload = () => setTimeout(() => {
  const d = f.contentDocument;
  if (lanes) { try { f.contentWindow.localStorage.setItem('itihas.expanded', '{"ctx":false,"lanes":true}'); } catch {} }
  const btn = (t) => [...d.querySelectorAll('.zoom-btn')].find((b) => b.textContent === t);
  for (let i = 0; i < zin; i++) btn('+').click();
  for (let i = 0; i < zout; i++) btn('−').click();
  d.querySelector('.timeline').scrollIntoView();
}, 1500);
</script>
